<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KriptoTakip v1.3 Dark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        .nav-active { background-color: #1e293b; color: #3b82f6; border-right: 4px solid #3b82f6; }
        .dark-card { background-color: #1e293b; border: 1px solid #334155; }
        .dark-input { background-color: #0f172a; border: 2px solid #334155; color: #f1f5f9; }
        .dark-input:focus { border-color: #3b82f6; }
        
        .loading-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .mobile-nav { display: flex; background-color: #1e293b; border-top: 1px solid #334155; }
            .nav-active { background-color: transparent; border: none; color: #3b82f6; }
        }

        /* Sayı inputlarındaki okları gizle */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Üst Bar -->
    <header class="bg-[#1e293b] border-b border-[#334155] z-50">
        <div class="px-6 h-20 flex items-center justify-between max-w-[1600px] mx-auto w-full">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-2xl shadow-lg shadow-blue-900/20">
                    <i data-lucide="wallet-minimal" class="text-white w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">KriptoTakip <span class="text-blue-500">v1.3</span></h1>
                    <div id="sync-indicator" class="flex items-center gap-1.5">
                        <div id="sync-dot" class="w-1.5 h-1.5 rounded-full bg-orange-500 loading-pulse"></div>
                        <span id="sync-status" class="text-[10px] font-bold text-slate-500 uppercase">Sistem Yükleniyor</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="hidden md:block text-right border-r pr-6 border-slate-700">
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Dolar Kuru</p>
                    <p id="live-rate-badge" class="font-bold text-blue-400">--.-- ₺</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Toplam Portföy</p>
                    <p id="header-total-value" class="font-black text-2xl text-white tracking-tighter">0 ₺</p>
                </div>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="sidebar w-72 bg-[#1e293b] border-r border-[#334155] p-6 flex flex-col justify-between">
            <div class="space-y-1.5">
                <button onclick="switchTab('dashboard')" class="w-full flex items-center gap-3 px-4 py-4 rounded-xl font-bold transition-all nav-active tab-btn" data-tab="dashboard">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i> Özet Paneli
                </button>
                <button onclick="switchTab('transfer')" class="w-full flex items-center gap-3 px-4 py-4 rounded-xl font-bold transition-all text-slate-400 hover:text-slate-200 tab-btn" data-tab="transfer">
                    <i data-lucide="arrow-up-right" class="w-5 h-5"></i> Yeni İşlem
                </button>
                <button onclick="switchTab('blocks')" class="w-full flex items-center gap-3 px-4 py-4 rounded-xl font-bold transition-all text-slate-400 hover:text-slate-200 tab-btn" data-tab="blocks">
                    <i data-lucide="timer" class="w-5 h-5"></i> Blokajlar
                </button>
                <button onclick="switchTab('history')" class="w-full flex items-center gap-3 px-4 py-4 rounded-xl font-bold transition-all text-slate-400 hover:text-slate-200 tab-btn" data-tab="history">
                    <i data-lucide="scroll-text" class="w-5 h-5"></i> Geçmiş
                </button>
            </div>
            
            <div class="bg-[#0f172a] p-4 rounded-2xl border border-[#334155]">
                <p class="text-[10px] font-bold text-slate-500 uppercase mb-3">Bulut Senkronizasyonu</p>
                <button onclick="saveData()" class="w-full flex items-center justify-center gap-2 py-3 bg-blue-600 hover:bg-blue-700 rounded-xl text-xs font-black text-white shadow-md active:scale-95 transition-all">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> MANUEL YEDEKLE
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-4 md:p-10 pb-32">
            <div id="tab-dashboard" class="tab-content active max-w-6xl mx-auto space-y-8">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- Aydın Card -->
                    <div class="dark-card rounded-[32px] overflow-hidden shadow-2xl">
                        <div class="p-8 border-b border-[#334155] flex justify-between items-center bg-gradient-to-r from-blue-900/20 to-transparent">
                            <div>
                                <h3 class="font-bold text-xl text-white">Aydın Kaya</h3>
                                <p class="text-xs text-blue-400 font-semibold uppercase tracking-wider">Bireysel Portföy</p>
                            </div>
                            <span id="aydin-total" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-2xl text-base font-black">0 ₺</span>
                        </div>
                        <div class="p-8 space-y-8">
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] block mb-4 flex items-center gap-2">
                                    <i data-lucide="landmark" class="w-3 h-3 text-blue-500"></i> Bankalar (TRY)
                                </label>
                                <div class="grid grid-cols-2 gap-4" id="aydin-banks-container"></div>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] block mb-4 flex items-center gap-2">
                                    <i data-lucide="bitcoin" class="w-3 h-3 text-orange-500"></i> Kripto Varlıklar (USD)
                                </label>
                                <div class="grid grid-cols-2 gap-4" id="aydin-crypto-container"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Berna Card -->
                    <div class="dark-card rounded-[32px] overflow-hidden shadow-2xl">
                        <div class="p-8 border-b border-[#334155] flex justify-between items-center bg-gradient-to-l from-purple-900/20 to-transparent">
                            <span id="berna-total" class="bg-purple-600/20 text-purple-400 border border-purple-500/30 px-5 py-2.5 rounded-2xl text-base font-black">0 ₺</span>
                            <div class="text-right">
                                <h3 class="font-bold text-xl text-white">Berna Kaya</h3>
                                <p class="text-xs text-purple-400 font-semibold uppercase tracking-wider">Bireysel Portföy</p>
                            </div>
                        </div>
                        <div class="p-8 space-y-8">
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] block mb-4 text-right flex items-center justify-end gap-2">
                                    Bankalar (TRY) <i data-lucide="landmark" class="w-3 h-3 text-purple-500"></i>
                                </label>
                                <div class="grid grid-cols-2 gap-4" id="berna-banks-container"></div>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] block mb-4 text-right flex items-center justify-end gap-2">
                                    Kripto Varlıklar (USD) <i data-lucide="bitcoin" class="w-3 h-3 text-orange-500"></i>
                                </label>
                                <div class="grid grid-cols-2 gap-4" id="berna-crypto-container"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-transfer" class="tab-content max-w-2xl mx-auto">
                <div class="dark-card rounded-[40px] p-10 shadow-2xl">
                    <h2 class="text-2xl font-black mb-8 text-white">Hızlı İşlem Kaydı</h2>
                    <form id="transfer-form" onsubmit="handleTransfer(event)" class="space-y-6">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-400 ml-1 uppercase">İşlem Türü</label>
                            <select id="t-type" onchange="updateTransferForm()" class="w-full p-4 dark-input rounded-2xl outline-none font-bold transition-all appearance-none">
                                <option value="bank_to_crypto">Banka -> Kripto (48S Blokaj)</option>
                                <option value="crypto_to_crypto">Kripto -> Kripto (Transfer)</option>
                                <option value="p2p_sell">Kripto -> Banka (P2P Satış)</option>
                                <option value="bank_to_bank">Banka -> Banka (EFT/Havale)</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-400 ml-1 uppercase">Hesap Sahibi</label>
                            <select id="t-person" onchange="updateTransferForm()" class="w-full p-4 dark-input rounded-2xl outline-none font-bold appearance-none">
                                <option value="aydin">Aydın Kaya</option>
                                <option value="berna">Berna Kaya</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-400 ml-1 uppercase">Kaynak</label>
                                <select id="t-source" class="w-full p-4 dark-input rounded-2xl outline-none font-bold appearance-none"></select>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-400 ml-1 uppercase">Hedef</label>
                                <select id="t-target" class="w-full p-4 dark-input rounded-2xl outline-none font-bold appearance-none"></select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-400 ml-1 uppercase">Çıkan Miktar</label>
                                <input type="number" id="t-amount-1" onfocus="handleInputFocus(this)" placeholder="0.00" step="0.01" required class="w-full p-4 dark-input rounded-2xl outline-none font-black text-red-400">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-400 ml-1 uppercase">Giren Miktar</label>
                                <input type="number" id="t-amount-2" onfocus="handleInputFocus(this)" placeholder="0.00" step="0.01" required class="w-full p-4 dark-input rounded-2xl outline-none font-black text-green-400">
                            </div>
                        </div>
                        <button type="submit" class="w-full py-5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black shadow-lg shadow-blue-900/40 active:scale-95 transition-all uppercase tracking-widest">İŞLEMİ ONAYLA</button>
                    </form>
                </div>
            </div>

            <div id="tab-blocks" class="tab-content max-w-4xl mx-auto space-y-6">
                <h2 class="text-2xl font-black text-white">Aktif Blokajlar</h2>
                <div id="blocks-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div id="tab-history" class="tab-content max-w-4xl mx-auto">
                <div class="dark-card rounded-[32px] overflow-hidden shadow-2xl">
                    <div class="p-6 border-b border-[#334155] bg-[#0f172a]">
                        <h2 class="text-xl font-black text-white">İşlem Kayıtları</h2>
                    </div>
                    <div id="history-list" class="divide-y divide-[#334155]"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Nav -->
    <nav class="mobile-nav hidden fixed bottom-0 left-0 right-0 px-6 py-4 justify-around items-center z-50">
        <button onclick="switchTab('dashboard')" class="p-2 tab-btn nav-active" data-tab="dashboard"><i data-lucide="layout-grid"></i></button>
        <button onclick="switchTab('transfer')" class="p-2 tab-btn text-slate-500" data-tab="transfer"><i data-lucide="arrow-up-right"></i></button>
        <button onclick="switchTab('blocks')" class="p-2 tab-btn text-slate-500" data-tab="blocks"><i data-lucide="timer"></i></button>
        <button onclick="switchTab('history')" class="p-2 tab-btn text-slate-500" data-tab="history"><i data-lucide="scroll-text"></i></button>
    </nav>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-[#0f172a]/80 backdrop-blur-xl hidden z-[100] flex items-center justify-center p-6" onclick="if(event.target === this) closeEditModal()">
        <div class="dark-card rounded-[40px] w-full max-w-sm p-10 shadow-2xl border-blue-500/30">
            <h4 id="modal-title" class="text-center text-[11px] font-black text-blue-500 uppercase mb-4 tracking-[0.3em]">BAKİYE GÜNCELLE</h4>
            <!-- Enter tuşu için form sarmalı veya direkt onkeydown -->
            <input type="number" id="modal-input" 
                   onfocus="handleInputFocus(this)" 
                   onkeydown="if(event.key === 'Enter') saveEdit()"
                   class="w-full text-center text-5xl font-black outline-none bg-[#0f172a] p-8 rounded-[32px] border-2 border-transparent focus:border-blue-600 mb-8 text-white">
            
            <div class="space-y-4">
                <button onclick="saveEdit()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-5 rounded-2xl font-black shadow-xl shadow-blue-900/40 active:scale-95 transition-all uppercase">DEĞİŞİKLİĞİ KAYDET</button>
                <button onclick="closeEditModal()" class="w-full py-4 text-slate-500 font-bold hover:text-slate-300">VAZGEÇ</button>
            </div>
            <p class="text-[9px] text-center text-slate-600 mt-6 uppercase tracking-widest">Onaylamak için ENTER'a basın</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse('{"apiKey":"AIzaSyBPFWe9FSkUBaiyaeBMhiXZm7g8QlfZzKQ","authDomain":"kripto-ee5f6.firebaseapp.com","projectId":"kripto-ee5f6","storageBucket":"kripto-ee5f6.firebasestorage.app","messagingSenderId":"896521474533","appId":"1:896521474533:web:6e054c33637cb500e59f0c"}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kripto-takip-v1-3';

        let state = {
            aydin: { banks: { 'ON Bank': 0, 'Kuveyt Türk': 0, 'İş Bankası': 0, 'Akbank': 0 }, crypto: { 'Binance TR': 0, 'Binance Global': 0 } },
            berna: { banks: { 'DenizBank': 0, 'Enpara': 0, 'Yapı Kredi': 0 }, crypto: { 'BtcTurk': 0, 'Binance Global': 0 } },
            blocks: [],
            history: []
        };
        let usdRate = 34.65;
        let currentUser = null;

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                try { await signInWithCustomToken(auth, __initial_auth_token); } catch (e) { await signInAnonymously(auth); }
            } else { await signInAnonymously(auth); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                updateStatus("Bulut Aktif", "bg-green-500");
                listenData();
            }
        });

        function listenData() {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'mainState', 'dataDoc');
            onSnapshot(docRef, (snap) => {
                if (snap.exists()) {
                    state = snap.data();
                    renderAll();
                } else { saveData(); }
            }, (err) => updateStatus("Bağlantı Hatası", "bg-red-500"));
        }

        async function saveData() {
            if (!currentUser) return;
            updateStatus("Kaydediliyor...", "bg-blue-500", true);
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'mainState', 'dataDoc');
            try {
                await setDoc(docRef, state);
                updateStatus("Senkronize Edildi", "bg-green-500");
            } catch (e) { updateStatus("Hata", "bg-red-500"); }
        }

        // input odaklandığında 0'ı temizleme fonksiyonu
        window.handleInputFocus = (el) => {
            if (parseFloat(el.value) === 0) el.value = "";
        };

        function updateStatus(txt, cls, load = false) {
            const statusText = document.getElementById('sync-status');
            const statusDot = document.getElementById('sync-dot');
            if (statusText) statusText.innerText = txt;
            if (statusDot) statusDot.className = `w-1.5 h-1.5 rounded-full ${cls} ${load ? 'loading-pulse' : ''}`;
        }

        function renderAll() {
            const fmt = (v, c) => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: c, maximumFractionDigits: 0 }).format(v);
            const card = (p, t, n, v, c) => `
                <div onclick="openEditModal('${p}','${t}','${n}',${v})" class="bg-[#0f172a] p-4 rounded-2xl border border-[#334155] hover:border-blue-500/50 active:scale-95 transition-all cursor-pointer group">
                    <p class="text-[9px] font-bold text-slate-500 uppercase tracking-tighter truncate group-hover:text-blue-400">${n}</p>
                    <p class="text-sm font-black text-white">${fmt(v, c)}</p>
                </div>`;

            let aT = 0, aU = 0, bT = 0, bU = 0;

            let aB = ""; 
            Object.entries(state.aydin.banks).forEach(([n,v]) => { aT+=v; aB+=card('aydin','banks',n,v,'TRY')});
            let aC = ""; 
            Object.entries(state.aydin.crypto).forEach(([n,v]) => { aU+=v; aC+=card('aydin','crypto',n,v,'USD')});
            document.getElementById('aydin-banks-container').innerHTML = aB;
            document.getElementById('aydin-crypto-container').innerHTML = aC;
            document.getElementById('aydin-total').innerText = fmt(aT + (aU*usdRate), 'TRY');

            let bB = ""; 
            Object.entries(state.berna.banks).forEach(([n,v]) => { bT+=v; bB+=card('berna','banks',n,v,'TRY')});
            let bC = ""; 
            Object.entries(state.berna.crypto).forEach(([n,v]) => { bU+=v; bC+=card('berna','crypto',n,v,'USD')});
            document.getElementById('berna-banks-container').innerHTML = bB;
            document.getElementById('berna-crypto-container').innerHTML = bC;
            document.getElementById('berna-total').innerText = fmt(bT + (bU*usdRate), 'TRY');

            document.getElementById('header-total-value').innerText = fmt((aT+aU*usdRate)+(bT+bU*usdRate), 'TRY');

            renderBlocks();
            renderHistory();
            updateTransferForm();
            lucide.createIcons();
        }

        function renderBlocks() {
            const container = document.getElementById('blocks-container');
            container.innerHTML = (state.blocks || []).map(b => `
                <div class="bg-[#1e293b] p-6 rounded-[24px] border border-orange-500/20 flex justify-between items-center shadow-lg">
                    <div>
                        <p class="text-[10px] font-black text-orange-500 uppercase tracking-widest">${b.person} - ${b.target}</p>
                        <p class="text-xl font-black text-white">${b.amount} $</p>
                    </div>
                    <button onclick="removeBlock(${b.id})" class="bg-orange-600/10 text-orange-500 border border-orange-500/30 px-5 py-2.5 rounded-xl text-xs font-black hover:bg-orange-600 hover:text-white transition-all">SERBEST BIRAK</button>
                </div>
            `).join('');
        }

        function renderHistory() {
            document.getElementById('history-list').innerHTML = (state.history || []).slice(0, 15).map(h => `
                <div class="p-5 flex justify-between items-center hover:bg-[#1e293b] transition-all">
                    <div>
                        <p class="text-sm font-bold text-slate-200">${h.msg}</p>
                        <p class="text-[10px] text-slate-500 font-bold">${h.date}</p>
                    </div>
                    <span class="text-[9px] font-black px-3 py-1.5 rounded-lg uppercase ${h.user === 'aydin' ? 'bg-blue-600/20 text-blue-400' : 'bg-purple-600/20 text-purple-400'}">${h.user}</span>
                </div>
            `).join('');
        }

        let activeEdit = null;
        window.openEditModal = (p, t, n, v) => {
            activeEdit = { p, t, n };
            document.getElementById('modal-title').innerText = n;
            document.getElementById('modal-input').value = v;
            document.getElementById('edit-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('modal-input').focus(), 100);
        };

        window.closeEditModal = () => document.getElementById('edit-modal').classList.add('hidden');

        window.saveEdit = async () => {
            const valInput = document.getElementById('modal-input');
            const val = parseFloat(valInput.value) || 0;
            state[activeEdit.p][activeEdit.t][activeEdit.n] = val;
            state.history.unshift({ date: new Date().toLocaleString('tr-TR'), msg: `${activeEdit.n} güncellendi: ${val}`, user: activeEdit.p });
            await saveData();
            closeEditModal();
        };

        window.updateTransferForm = () => {
            const p = document.getElementById('t-person').value;
            const type = document.getElementById('t-type').value;
            const src = document.getElementById('t-source');
            const trg = document.getElementById('t-target');
            if(!src || !trg) return;
            src.innerHTML = ""; trg.innerHTML = "";
            const banks = Object.keys(state[p].banks);
            const crypto = Object.keys(state[p].crypto);
            if (type === 'bank_to_crypto') {
                banks.forEach(b => src.add(new Option(b, b)));
                crypto.forEach(c => trg.add(new Option(c, c)));
            } else if (type === 'crypto_to_crypto') {
                crypto.forEach(c => src.add(new Option(c, c)));
                crypto.forEach(c => trg.add(new Option(c, c)));
            } else if (type === 'p2p_sell') {
                crypto.forEach(c => src.add(new Option(c, c)));
                banks.forEach(b => trg.add(new Option(b, b)));
            } else {
                banks.forEach(b => src.add(new Option(b, b)));
                banks.forEach(b => trg.add(new Option(b, b)));
            }
        };

        window.handleTransfer = async (e) => {
            e.preventDefault();
            const type = document.getElementById('t-type').value;
            const p = document.getElementById('t-person').value;
            const src = document.getElementById('t-source').value;
            const trg = document.getElementById('t-target').value;
            const a1 = parseFloat(document.getElementById('t-amount-1').value) || 0;
            const a2 = parseFloat(document.getElementById('t-amount-2').value) || 0;

            if (type === 'bank_to_crypto') {
                state[p].banks[src] -= a1; state[p].crypto[trg] += a2;
                state.blocks.push({ id: Date.now(), person: p, target: trg, amount: a2 });
            } else if (type === 'crypto_to_crypto') {
                state[p].crypto[src] -= a1; state[p].crypto[trg] += a2;
            } else if (type === 'p2p_sell') {
                state[p].crypto[src] -= a1; state[p].banks[trg] += a2;
            } else {
                state[p].banks[src] -= a1; state[p].banks[trg] += a2;
            }

            state.history.unshift({ date: new Date().toLocaleString('tr-TR'), msg: `${src} -> ${trg} aktarımı yapıldı`, user: p });
            await saveData();
            switchTab('dashboard');
            e.target.reset();
        };

        window.removeBlock = async (id) => {
            state.blocks = state.blocks.filter(b => b.id !== id);
            await saveData();
        };

        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => {
                if (b.dataset.tab === id) b.classList.add('nav-active');
                else b.classList.remove('nav-active');
            });
            lucide.createIcons();
        };

        const updateRate = async () => {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTTRY');
                const d = await res.json();
                usdRate = parseFloat(d.price);
                document.getElementById('live-rate-badge').innerText = `${usdRate.toFixed(2)} ₺`;
                renderAll();
            } catch (e) {}
        };

        window.saveData = saveData;
        setInterval(updateRate, 60000);
        updateRate();
        initAuth();
    </script>
</body>
</html>
