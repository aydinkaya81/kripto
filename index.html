<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finans & Kripto Takip Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .loading-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .toast { transition: all 0.3s ease; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <header class="bg-slate-900 text-white shadow-md z-10">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="wallet" class="text-blue-400"></i>
                <h1 class="text-xl font-bold tracking-wide">KriptoTakip <span class="text-slate-400 font-normal text-sm">v1.4</span></h1>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <div class="flex flex-col text-right">
                    <span class="text-slate-400 text-xs">Toplam Varlık</span>
                    <span id="header-total-value" class="font-bold text-green-400">0.00 ₺</span>
                </div>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Navigation -->
        <nav class="w-64 bg-white border-r border-slate-200 flex flex-col p-4 hidden md:flex">
            <div class="space-y-2">
                <button onclick="switchTab('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left font-medium transition-colors bg-blue-50 text-blue-700">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Özet & Bakiyeler
                </button>
                <button onclick="switchTab('transfer')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left font-medium text-slate-600 hover:bg-slate-50">
                    <i data-lucide="arrow-right-left" class="w-5 h-5"></i> Yeni İşlem
                </button>
                <button onclick="switchTab('history')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left font-medium text-slate-600 hover:bg-slate-50">
                    <i data-lucide="calendar-days" class="w-5 h-5"></i> İşlem Geçmişi
                </button>
            </div>
            <div class="mt-auto pt-4 border-t border-slate-100">
                <button onclick="saveData()" class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-slate-900 text-white rounded-lg font-medium hover:bg-slate-800 transition-colors">
                    <i data-lucide="cloud-upload" class="w-4 h-4"></i> Manuel Kaydet
                </button>
            </div>
        </nav>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-slate-50">
            <!-- Sync Indicator -->
            <div class="mb-6 flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">Bulut Durumu</h2>
                    <div class="flex items-center gap-2 mt-1">
                        <div id="sync-dot" class="w-3 h-3 rounded-full bg-orange-400 loading-pulse"></div>
                        <span id="sync-status" class="text-sm text-slate-500 font-medium">Bağlanıyor...</span>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block uppercase font-bold">Kur (USDT/TRY)</span>
                    <span id="live-rate" class="text-blue-600 font-bold">Yükleniyor...</span>
                </div>
            </div>

            <!-- Dashboard Content -->
            <div id="tab-dashboard" class="tab-content active space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Aydın Kaya Card -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                            <h3 class="font-bold text-slate-800 flex items-center gap-2"><i data-lucide="user" class="text-blue-500"></i> Aydın Kaya</h3>
                            <span id="aydin-total" class="font-bold text-blue-700">0.00 ₺</span>
                        </div>
                        <div class="p-6 space-y-4">
                            <div>
                                <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Bankalar (₺)</p>
                                <div id="aydin-banks" class="grid grid-cols-2 gap-2"></div>
                            </div>
                            <div class="pt-4 border-t border-slate-100">
                                <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Kripto ($)</p>
                                <div id="aydin-crypto" class="grid grid-cols-2 gap-2"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Berna Kaya Card -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                            <h3 class="font-bold text-slate-800 flex items-center gap-2"><i data-lucide="user" class="text-purple-500"></i> Berna Kaya</h3>
                            <span id="berna-total" class="font-bold text-purple-700">0.00 ₺</span>
                        </div>
                        <div class="p-6 space-y-4">
                            <div>
                                <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Bankalar (₺)</p>
                                <div id="berna-banks" class="grid grid-cols-2 gap-2"></div>
                            </div>
                            <div class="pt-4 border-t border-slate-100">
                                <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Kripto ($)</p>
                                <div id="berna-crypto" class="grid grid-cols-2 gap-2"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Transfer Tab -->
            <div id="tab-transfer" class="tab-content max-w-2xl mx-auto">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h2 class="text-xl font-bold mb-4">Transfer Yap</h2>
                    <form id="transfer-form" onsubmit="handleTransfer(event)" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">Kişi</label>
                                <select id="t-person" class="w-full border p-2 rounded-lg bg-slate-50 outline-none" onchange="updateTransferForm()">
                                    <option value="aydin">Aydın Kaya</option>
                                    <option value="berna">Berna Kaya</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">İşlem Tipi</label>
                                <select id="t-type" class="w-full border p-2 rounded-lg bg-slate-50 outline-none" onchange="updateTransferForm()">
                                    <option value="bank_to_bank">Banka -> Banka</option>
                                    <option value="bank_to_crypto">Banka -> Kripto</option>
                                    <option value="crypto_to_crypto">Kripto -> Kripto</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">Kaynak</label>
                                <select id="t-source" class="w-full border p-2 rounded-lg bg-white outline-none"></select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">Hedef</label>
                                <select id="t-target" class="w-full border p-2 rounded-lg bg-white outline-none"></select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">Miktar (Çıkan)</label>
                                <input type="number" id="t-amount" step="0.01" required class="w-full border p-2 rounded-lg">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">Miktar (Giren)</label>
                                <input type="number" id="t-amount-in" step="0.01" required class="w-full border p-2 rounded-lg">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors">İşlemi Tamamla</button>
                    </form>
                </div>
            </div>

            <!-- History Tab -->
            <div id="tab-history" class="tab-content">
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 uppercase text-[10px] font-bold">
                            <tr>
                                <th class="px-6 py-4">Tarih</th>
                                <th class="px-6 py-4">Kişi</th>
                                <th class="px-6 py-4">İşlem</th>
                                <th class="px-6 py-4">Detay</th>
                            </tr>
                        </thead>
                        <tbody id="history-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/60 hidden z-50 flex items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="edit-title" class="font-bold text-slate-800">Bakiye Düzenle</h3>
                    <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x"></i></button>
                </div>
                <div class="space-y-4">
                    <p id="edit-label" class="text-sm text-slate-500 font-medium"></p>
                    <input type="number" id="edit-input" step="0.01" class="w-full border-2 border-slate-200 p-4 rounded-xl text-2xl font-bold outline-none focus:border-blue-500 transition-colors">
                    <button onclick="confirmEdit()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-black transition-all">Güncelle ve Kaydet</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPFWe9FSkUBaiyaeBMhiXZm7g8QlfZzKQ",
            authDomain: "kripto-ee5f6.firebaseapp.com",
            projectId: "kripto-ee5f6",
            storageBucket: "kripto-ee5f6.firebasestorage.app",
            messagingSenderId: "896521474533",
            appId: "1:896521474533:web:6e054c33637cb500e59f0c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "kripto_v1";

        let state = {
            aydin: {
                banks: { 'ON Bank': 0, 'Kuveyt Türk': 0, 'İş Bankası': 0, 'Halkbank': 0, 'Akbank': 0, 'TOM Bank': 0, 'VakıfBank': 0 },
                crypto: { 'Binance TR': 0, 'Binance Global': 0 }
            },
            berna: {
                banks: { 'DenizBank': 0, 'Enpara': 0, 'Yapı Kredi': 0, 'İş Bankası': 0, 'Akbank': 0 },
                crypto: { 'BtcTurk': 0, 'Binance Global': 0 }
            },
            history: []
        };

        let isReady = false;
        let usdRate = 34.25;

        // Auth
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                syncData();
            } else {
                await signInAnonymously(auth);
            }
        });

        // Firebase Sync
        function syncData() {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'mainState');
            onSnapshot(docRef, (snap) => {
                if (snap.exists()) {
                    state = snap.data();
                    updateStatus("Bulut Aktif", "bg-green-500");
                } else {
                    updateStatus("Yeni Veritabanı", "bg-blue-400");
                    saveData(); // İlk kurulum
                }
                isReady = true;
                render();
            }, (err) => {
                console.error(err);
                updateStatus("Bağlantı Hatası!", "bg-red-600");
            });
        }

        async function saveData() {
            if (!isReady && state.history.length > 0) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'mainState');
            try {
                updateStatus("Kaydediliyor...", "bg-orange-400", true);
                await setDoc(docRef, state);
                updateStatus("Bulut Aktif", "bg-green-500");
            } catch (e) {
                showToast("Kayıt Başarısız!");
            }
        }

        // Render functions
        function render() {
            const format = (v, c) => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: c }).format(v);
            
            const createItem = (p, t, n, v, c) => `
                <div onclick="openEdit('${p}','${t}','${n}',${v})" class="bg-white border border-slate-100 p-3 rounded-xl hover:shadow-md cursor-pointer transition-all">
                    <p class="text-[9px] font-bold text-slate-400 uppercase truncate">${n}</p>
                    <p class="font-bold text-slate-800 text-xs">${format(v, c)}</p>
                </div>`;

            let aT = 0, aU = 0, bT = 0, bU = 0;

            document.getElementById('aydin-banks').innerHTML = Object.entries(state.aydin.banks).map(([n,v]) => { aT += v; return createItem('aydin','banks',n,v,'TRY')}).join('');
            document.getElementById('aydin-crypto').innerHTML = Object.entries(state.aydin.crypto).map(([n,v]) => { aU += v; return createItem('aydin','crypto',n,v,'USD')}).join('');
            document.getElementById('berna-banks').innerHTML = Object.entries(state.berna.banks).map(([n,v]) => { bT += v; return createItem('berna','banks',n,v,'TRY')}).join('');
            document.getElementById('berna-crypto').innerHTML = Object.entries(state.berna.crypto).map(([n,v]) => { bU += v; return createItem('berna','crypto',n,v,'USD')}).join('');

            const aTotal = aT + (aU * usdRate);
            const bTotal = bT + (bU * usdRate);
            document.getElementById('aydin-total').innerText = format(aTotal, 'TRY');
            document.getElementById('berna-total').innerText = format(bTotal, 'TRY');
            document.getElementById('header-total-value').innerText = format(aTotal + bTotal, 'TRY');
            
            renderHistory();
            updateTransferForm();
            lucide.createIcons();
        }

        function renderHistory() {
            document.getElementById('history-list').innerHTML = state.history.slice(0, 15).map(h => `
                <tr>
                    <td class="px-6 py-4 text-xs text-slate-400">${h.date}</td>
                    <td class="px-6 py-4 font-bold capitalize">${h.person}</td>
                    <td class="px-6 py-4 text-blue-600 font-medium">${h.type}</td>
                    <td class="px-6 py-4 text-slate-500">${h.detail}</td>
                </tr>
            `).join('');
        }

        // Logic
        let activeEdit = null;
        window.openEdit = (p, t, n, v) => {
            activeEdit = { p, t, n };
            document.getElementById('edit-label').innerText = n;
            document.getElementById('edit-input').value = v;
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        window.confirmEdit = () => {
            const val = parseFloat(document.getElementById('edit-input').value) || 0;
            state[activeEdit.p][activeEdit.t][activeEdit.n] = val;
            state.history.unshift({ date: new Date().toLocaleString('tr-TR'), person: activeEdit.p, type: 'Düzenleme', detail: `${activeEdit.n} güncellendi.` });
            closeEditModal();
            saveData();
            render();
        };

        window.handleTransfer = (e) => {
            e.preventDefault();
            const p = document.getElementById('t-person').value;
            const type = document.getElementById('t-type').value;
            const src = document.getElementById('t-source').value;
            const trg = document.getElementById('t-target').value;
            const amt = parseFloat(document.getElementById('t-amount').value);
            const amtIn = parseFloat(document.getElementById('t-amount-in').value);

            if (type === 'bank_to_crypto') {
                state[p].banks[src] -= amt;
                state[p].crypto[trg] += amtIn;
            } else if (type === 'crypto_to_crypto') {
                state[p].crypto[src] -= amt;
                state[p].crypto[trg] += amtIn;
            } else {
                state[p].banks[src] -= amt;
                state[p].banks[trg] += amtIn;
            }

            state.history.unshift({ date: new Date().toLocaleString('tr-TR'), person: p, type: 'Transfer', detail: `${src} -> ${trg} (${amt})` });
            saveData();
            switchTab('dashboard');
        };

        window.updateTransferForm = () => {
            const p = document.getElementById('t-person').value;
            const type = document.getElementById('t-type').value;
            const src = document.getElementById('t-source');
            const trg = document.getElementById('t-target');
            src.innerHTML = ''; trg.innerHTML = '';

            const banks = Object.keys(state[p].banks);
            const cryptos = Object.keys(state[p].crypto);

            if (type === 'bank_to_crypto') {
                banks.forEach(b => src.add(new Option(b, b)));
                cryptos.forEach(c => trg.add(new Option(c, c)));
            } else if (type === 'crypto_to_crypto') {
                cryptos.forEach(c => src.add(new Option(c, c)));
                cryptos.forEach(c => trg.add(new Option(c, c)));
            } else {
                banks.forEach(b => src.add(new Option(b, b)));
                banks.forEach(b => trg.add(new Option(b, b)));
            }
        };

        // UI Helpers
        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active');
            lucide.createIcons();
        };

        window.closeEditModal = () => document.getElementById('edit-modal').classList.add('hidden');

        function updateStatus(text, color, loading = false) {
            document.getElementById('sync-status').innerText = text;
            document.getElementById('sync-dot').className = `w-3 h-3 rounded-full ${color} ${loading ? 'loading-pulse' : ''}`;
        }

        function showToast(m) {
            const container = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = "bg-slate-800 text-white px-6 py-3 rounded-xl shadow-lg toast translate-x-full";
            t.innerText = m;
            container.appendChild(t);
            setTimeout(() => t.classList.remove('translate-x-full'), 100);
            setTimeout(() => { t.classList.add('translate-x-full'); setTimeout(() => t.remove(), 500); }, 3000);
        }

        const fetchRate = async () => {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTTRY');
                const data = await res.json();
                usdRate = parseFloat(data.price);
                document.getElementById('live-rate').innerText = `1 USDT = ${usdRate.toFixed(2)} ₺`;
                render();
            } catch (e) {}
        };

        window.saveData = saveData;
        fetchRate();
        setInterval(fetchRate, 30000);
    </script>
</body>
</html>
