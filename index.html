<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KayaFinans Pro v2.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --ios-blue: #007AFF; --ios-bg: #F2F2F7; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--ios-bg); -webkit-tap-highlight-color: transparent; overflow: hidden; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: ios-fade 0.4s ease; }
        @keyframes ios-fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .ios-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-radius: 24px; border: 0.5px solid rgba(0,0,0,0.05); }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); }
    </style>
</head>
<body class="text-slate-900 h-screen flex flex-col">

    <div class="flex flex-1 overflow-hidden">
        <!-- Masaüstü Sidebar -->
        <aside class="w-80 bg-white border-r border-slate-200 hidden lg:flex flex-col p-8 gap-8">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center shadow-xl text-white">
                    <i data-lucide="wallet" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-tight">KayaFinans</h1>
            </div>
            <nav class="flex flex-col gap-2">
                <button onclick="switchTab('dashboard')" class="flex items-center gap-4 p-4 rounded-2xl font-bold text-slate-900 bg-slate-100" id="btn-dashboard">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i> Özet
                </button>
                <button onclick="switchTab('transfer')" class="flex items-center gap-4 p-4 rounded-2xl font-bold text-slate-400" id="btn-transfer">
                    <i data-lucide="send" class="w-5 h-5"></i> İşlem Yap
                </button>
                <button onclick="switchTab('history')" class="flex items-center gap-4 p-4 rounded-2xl font-bold text-slate-400" id="btn-history">
                    <i data-lucide="clock" class="w-5 h-5"></i> Geçmiş
                </button>
            </nav>
            <div class="mt-auto ios-card p-6 shadow-sm border border-slate-100">
                <div class="flex items-center gap-2 mb-2">
                    <div id="status-dot" class="w-2 h-2 rounded-full bg-green-500"></div>
                    <span id="status-text" class="text-[10px] font-bold text-slate-500 uppercase">Sistem Aktif</span>
                </div>
                <p id="last-update" class="text-[9px] text-slate-400">Veri senkronize edildi</p>
            </div>
        </aside>

        <!-- Ana Panel -->
        <main class="flex-1 overflow-y-auto relative pb-32 lg:pb-12">
            <!-- Mobil Header (İlk Tasarım Stili) -->
            <div class="lg:hidden p-8 pt-16 flex justify-between items-end bg-white/50 border-b border-slate-100">
                <div>
                    <h2 class="text-3xl font-black tracking-tighter">Varlıklar</h2>
                    <div id="status-mobile" class="text-[9px] font-black text-green-600 mt-1 uppercase">● SENKRONİZE</div>
                </div>
                <div class="text-right">
                    <p id="total-balance" class="text-2xl font-black text-slate-900">0 ₺</p>
                    <p id="usd-rate-text" class="text-[10px] font-bold text-blue-500 tracking-tighter">USDT: ...</p>
                </div>
            </div>

            <div class="p-6 lg:p-12 max-w-6xl mx-auto space-y-8">
                
                <!-- DASHBOARD (KART TASARIMI) -->
                <div id="tab-dashboard" class="tab-content active space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Aydın Kaya (Koyu Tema) -->
                        <div class="ios-card overflow-hidden shadow-2xl">
                            <div class="p-8 bg-slate-900 text-white flex justify-between items-center">
                                <div>
                                    <p class="text-[10px] font-bold opacity-50 uppercase tracking-widest">Aydın Kaya</p>
                                    <h3 class="text-2xl font-bold">Portföy Lideri</h3>
                                </div>
                                <div id="aydin-total" class="text-2xl font-black">0 ₺</div>
                            </div>
                            <div class="p-6 space-y-6">
                                <div>
                                    <h4 class="text-[10px] font-black text-slate-400 uppercase mb-3 px-2">Banka Hesapları</h4>
                                    <div id="aydin-banks" class="space-y-2"></div>
                                </div>
                                <div>
                                    <h4 class="text-[10px] font-black text-slate-400 uppercase mb-3 px-2">Kripto Varlıklar</h4>
                                    <div id="aydin-crypto" class="space-y-2"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Berna Kaya (Mavi Tema) -->
                        <div class="ios-card overflow-hidden shadow-2xl">
                            <div class="p-8 bg-blue-600 text-white flex justify-between items-center">
                                <div>
                                    <p class="text-[10px] font-bold opacity-50 uppercase tracking-widest">Berna Kaya</p>
                                    <h3 class="text-2xl font-bold">Portföy Ortağı</h3>
                                </div>
                                <div id="berna-total" class="text-2xl font-black">0 ₺</div>
                            </div>
                            <div class="p-6 space-y-6">
                                <div>
                                    <h4 class="text-[10px] font-black text-slate-400 uppercase mb-3 px-2">Banka Hesapları</h4>
                                    <div id="berna-banks" class="space-y-2"></div>
                                </div>
                                <div>
                                    <h4 class="text-[10px] font-black text-slate-400 uppercase mb-3 px-2">Kripto Varlıklar</h4>
                                    <div id="berna-crypto" class="space-y-2"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TRANSFER TAB -->
                <div id="tab-transfer" class="tab-content">
                    <div class="ios-card p-10 max-w-xl mx-auto shadow-2xl border border-white">
                        <h3 class="text-2xl font-black mb-8 text-center">İşlem Girişi</h3>
                        <form id="transfer-form" class="space-y-5">
                            <div class="grid grid-cols-2 gap-4">
                                <select id="tr-person" class="bg-slate-100 p-5 rounded-3xl font-bold outline-none border-2 border-transparent focus:border-blue-500">
                                    <option value="aydin">Aydın Kaya</option>
                                    <option value="berna">Berna Kaya</option>
                                </select>
                                <select id="tr-type" class="bg-slate-100 p-5 rounded-3xl font-bold outline-none border-2 border-transparent focus:border-blue-500">
                                    <option value="b2b">Nakit İşlem</option>
                                    <option value="b2c">Kripto İşlem</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <input type="number" id="tr-out" placeholder="Çıkan (-)" class="bg-red-50 p-5 rounded-3xl font-bold text-center text-red-600 outline-none placeholder:text-red-200">
                                <input type="number" id="tr-in" placeholder="Giren (+)" class="bg-green-50 p-5 rounded-3xl font-bold text-center text-green-600 outline-none placeholder:text-green-200">
                            </div>
                            <button type="submit" class="w-full bg-slate-900 text-white p-6 rounded-[30px] font-black shadow-xl hover:bg-black active:scale-95 transition-all">SİSTEME İŞLE</button>
                        </form>
                    </div>
                </div>

                <!-- HISTORY TAB -->
                <div id="tab-history" class="tab-content">
                    <div class="ios-card overflow-hidden">
                        <div class="p-6 border-b border-slate-50 flex justify-between items-center bg-white/50">
                            <h3 class="font-bold uppercase text-[11px] tracking-widest text-slate-400">Son 20 İşlem</h3>
                            <button onclick="clearLogs()" class="text-red-500 text-[10px] font-black uppercase">Geçmişi Sil</button>
                        </div>
                        <div id="history-list" class="divide-y divide-slate-50 bg-white"></div>
                    </div>
                </div>

            </div>
        </main>

        <!-- Mobil Navigasyon -->
        <nav class="lg:hidden fixed bottom-0 left-0 right-0 glass-panel border-t border-slate-100 px-8 pb-10 pt-4 flex justify-around z-50">
            <button onclick="switchTab('dashboard')" class="flex flex-col items-center gap-1 text-slate-900 nav-btn" data-tab="dashboard">
                <i data-lucide="layout-grid" class="w-6 h-6"></i>
                <span class="text-[9px] font-black uppercase">Özet</span>
            </button>
            <button onclick="switchTab('transfer')" class="flex flex-col items-center gap-1 text-slate-400 nav-btn" data-tab="transfer">
                <i data-lucide="plus-circle" class="w-6 h-6"></i>
                <span class="text-[9px] font-black uppercase">Ekle</span>
            </button>
            <button onclick="switchTab('history')" class="flex flex-col items-center gap-1 text-slate-400 nav-btn" data-tab="history">
                <i data-lucide="clock" class="w-6 h-6"></i>
                <span class="text-[9px] font-black uppercase">Kayıt</span>
            </button>
        </nav>
    </div>

    <!-- Veri Düzenleme Modalı -->
    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden z-[100] flex items-center justify-center p-6">
        <div class="bg-white rounded-[40px] w-full max-w-xs p-10 shadow-2xl">
            <h4 id="modal-title" class="text-center text-[11px] font-black text-slate-400 uppercase mb-4 tracking-widest">DÜZENLE</h4>
            <div class="relative mb-8">
                <input type="number" id="modal-input" 
                       onclick="handleZeroClear(this)" 
                       class="w-full text-center text-5xl font-black outline-none bg-slate-50 p-6 rounded-[30px] border-2 border-transparent focus:border-blue-500 transition-all">
                <span id="modal-currency" class="absolute bottom-2 right-4 text-[10px] font-bold text-slate-300"></span>
            </div>
            <div class="flex flex-col gap-3">
                <button onclick="saveModal()" class="w-full bg-slate-900 p-5 rounded-2xl font-black text-white shadow-xl active:scale-95 transition-all">GÜNCELLE</button>
                <button onclick="closeModal()" class="w-full bg-slate-100 p-4 rounded-2xl font-bold text-slate-400">VAZGEÇ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPFWe9FSkUBaiyaeBMhiXZm7g8QlfZzKQ",
            authDomain: "kripto-ee5f6.firebaseapp.com",
            projectId: "kripto-ee5f6",
            storageBucket: "kripto-ee5f6.firebasestorage.app",
            messagingSenderId: "896521474533",
            appId: "1:896521474533:web:6e054c33637cb500e59f0c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const stateDoc = doc(db, "kullanicilar", "kaya_ailesi");

        const initial = {
            aydin: {
                banks: { 'ON Bank': 0, 'Kuveyt Türk': 0, 'İş Bankası': 0, 'Halkbank': 0, 'Akbank': 0, 'TOM Bank': 0, 'VakıfBank': 0 },
                crypto: { 'Binance TR': 0, 'Binance Global': 0 }
            },
            berna: {
                banks: { 'DenizBank': 0, 'Enpara': 0, 'Yapı Kredi': 0, 'İş Bankası': 0, 'Akbank': 0 },
                crypto: { 'BtcTurk': 0, 'Binance Global': 0 }
            },
            logs: []
        };

        let state = {...initial};
        let usd = 34.65;
        let isSaving = false;

        // Modal "0" temizleme mantığı
        window.handleZeroClear = (el) => {
            if (el.value === "0") el.value = "";
        };

        async function start() {
            try {
                await signInAnonymously(auth);
                onSnapshot(stateDoc, async (snap) => {
                    if (snap.exists()) {
                        state = snap.data();
                    } else {
                        await setDoc(stateDoc, initial);
                    }
                    render();
                    document.getElementById('last-update').innerText = "Son Senk: " + new Date().toLocaleTimeString();
                });
            } catch (e) {
                console.error("Firebase Başlatma Hatası");
            }
        }

        function render() {
            const fmt = (v, c) => new Intl.NumberFormat('tr-TR', { 
                style: 'currency', currency: c, maximumFractionDigits: 0 
            }).format(v);
            
            const card = (p, t, n, v, c) => `
                <div onclick="openModal('${p}','${t}','${n}',${v},'${c}')" class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center active:scale-95 transition-all cursor-pointer border border-slate-100/50">
                    <span class="text-[11px] font-bold text-slate-500">${n}</span>
                    <span class="text-sm font-black text-slate-900">${fmt(v, c)}</span>
                </div>`;

            let aT = 0, aU = 0, bT = 0, bU = 0;

            if(state.aydin) {
                document.getElementById('aydin-banks').innerHTML = Object.entries(state.aydin.banks || {}).map(([n,v]) => { aT += v; return card('aydin','banks',n,v,'TRY') }).join('');
                document.getElementById('aydin-crypto').innerHTML = Object.entries(state.aydin.crypto || {}).map(([n,v]) => { aU += v; return card('aydin','crypto',n,v,'USD') }).join('');
            }
            if(state.berna) {
                document.getElementById('berna-banks').innerHTML = Object.entries(state.berna.banks || {}).map(([n,v]) => { bT += v; return card('berna','banks',n,v,'TRY') }).join('');
                document.getElementById('berna-crypto').innerHTML = Object.entries(state.berna.crypto || {}).map(([n,v]) => { bU += v; return card('berna','crypto',n,v,'USD') }).join('');
            }

            const aSum = aT + (aU * usd);
            const bSum = bT + (bU * usd);

            document.getElementById('aydin-total').innerText = fmt(aSum, 'TRY');
            document.getElementById('berna-total').innerText = fmt(bSum, 'TRY');
            document.getElementById('total-balance').innerText = fmt(aSum + bSum, 'TRY');

            document.getElementById('history-list').innerHTML = (state.logs || []).slice(0, 20).map(l => `
                <div class="p-5 flex justify-between items-center">
                    <div>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">${l.date}</p>
                        <p class="text-[12px] font-black text-slate-800">${l.msg}</p>
                    </div>
                    <span class="text-[8px] font-black px-3 py-1 rounded-full ${l.user === 'aydin' ? 'bg-slate-900' : 'bg-blue-600'} text-white uppercase">${l.user}</span>
                </div>
            `).join('');

            lucide.createIcons();
        }

        let activeEdit = null;
        window.openModal = (p, t, n, v, c) => {
            activeEdit = { p, t, n };
            document.getElementById('modal-title').innerText = n;
            document.getElementById('modal-input').value = v;
            document.getElementById('modal-currency').innerText = c;
            document.getElementById('modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('modal').classList.add('hidden');

        window.saveModal = async () => {
            if(isSaving) return;
            isSaving = true;
            const val = parseFloat(document.getElementById('modal-input').value) || 0;
            state[activeEdit.p][activeEdit.t][activeEdit.n] = val;
            state.logs.unshift({ 
                date: new Date().toLocaleTimeString('tr-TR'), 
                msg: `${activeEdit.n}: ${val}`, 
                user: activeEdit.p 
            });
            await setDoc(stateDoc, state);
            closeModal();
            isSaving = false;
        };

        document.getElementById('transfer-form').onsubmit = async (e) => {
            e.preventDefault();
            const p = document.getElementById('tr-person').value;
            const outAmt = parseFloat(document.getElementById('tr-out').value) || 0;
            const inAmt = parseFloat(document.getElementById('tr-in').value) || 0;
            state.logs.unshift({ 
                date: new Date().toLocaleTimeString('tr-TR'), 
                msg: `Yeni Kayıt: -${outAmt} / +${inAmt}`, 
                user: p 
            });
            await setDoc(stateDoc, state);
            e.target.reset();
            switchTab('dashboard');
        };

        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('text-slate-900', btn.dataset.tab === id);
                btn.classList.toggle('text-slate-400', btn.dataset.tab !== id);
            });
            lucide.createIcons();
        };

        window.clearLogs = async () => {
            if(confirm("Tüm geçmiş silinecek?")) {
                state.logs = [];
                await setDoc(stateDoc, state);
            }
        };

        const updateKur = async () => {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTTRY');
                const data = await res.json();
                usd = parseFloat(data.price);
                document.getElementById('usd-rate-text').innerText = `USDT: ${usd.toFixed(2)} ₺`;
                render();
            } catch (e) {}
        };

        updateKur();
        setInterval(updateKur, 60000);
        start();
    </script>
</body>
</html>
