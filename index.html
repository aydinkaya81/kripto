<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KriptoTakip v1.3 Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .nav-active { background-color: #eff6ff; color: #2563eb; border-right: 4px solid #2563eb; }
        .loading-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .mobile-nav { display: flex; }
            .nav-active { background-color: transparent; border-right: none; color: #2563eb; }
        }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Üst Bar -->
    <header class="bg-white border-b border-slate-200 z-50">
        <div class="px-6 h-20 flex items-center justify-between max-w-[1600px] mx-auto w-full">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-xl shadow-lg shadow-blue-200">
                    <i data-lucide="wallet-minimal" class="text-white w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">KriptoTakip <span class="text-blue-600">v1.3</span></h1>
                    <div id="sync-indicator" class="flex items-center gap-1.5">
                        <div id="sync-dot" class="w-1.5 h-1.5 rounded-full bg-orange-400 loading-pulse"></div>
                        <span id="sync-status" class="text-[10px] font-medium text-slate-400 uppercase">Başlatılıyor...</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="hidden md:block text-right border-r pr-6 border-slate-100">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Canlı Kur</p>
                    <p id="live-rate-badge" class="font-bold text-slate-900">34.xx ₺</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Net Varlık</p>
                    <p id="header-total-value" class="font-black text-xl text-blue-600 tracking-tighter">0 ₺</p>
                </div>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="sidebar w-72 bg-white border-r border-slate-100 p-6 flex flex-col justify-between">
            <div class="space-y-2">
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-semibold transition-all hover:bg-slate-50 nav-active tab-btn" data-tab="dashboard">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i> Özet Paneli
                </button>
                <button onclick="switchTab('transfer')" id="btn-transfer" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-semibold transition-all hover:bg-slate-50 text-slate-500 tab-btn" data-tab="transfer">
                    <i data-lucide="arrow-up-right" class="w-5 h-5"></i> Yeni İşlem
                </button>
                <button onclick="switchTab('blocks')" id="btn-blocks" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-semibold transition-all hover:bg-slate-50 text-slate-500 tab-btn" data-tab="blocks">
                    <i data-lucide="timer" class="w-5 h-5"></i> Blokajlar
                </button>
                <button onclick="switchTab('history')" id="btn-history" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-semibold transition-all hover:bg-slate-50 text-slate-500 tab-btn" data-tab="history">
                    <i data-lucide="scroll-text" class="w-5 h-5"></i> Kayıtlar
                </button>
            </div>
            
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Sistem</p>
                <button onclick="saveData()" class="w-full flex items-center justify-center gap-2 py-3 bg-white border border-slate-200 rounded-xl text-xs font-bold shadow-sm active:scale-95 transition-all">
                    <i data-lucide="cloud-upload" class="w-4 h-4 text-blue-500"></i> Buluta Yedekle
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-4 md:p-10 pb-32">
            <div id="tab-dashboard" class="tab-content active max-w-5xl mx-auto space-y-8">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- Aydın Card -->
                    <div class="bg-white rounded-[32px] border border-slate-100 shadow-sm overflow-hidden">
                        <div class="p-8 border-b border-slate-50 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-xl">Aydın Kaya</h3>
                                <p class="text-xs text-slate-400 font-medium">Bireysel Portföy</p>
                            </div>
                            <span id="aydin-total" class="bg-blue-600 text-white px-4 py-2 rounded-2xl text-sm font-bold shadow-lg shadow-blue-100">0 ₺</span>
                        </div>
                        <div class="p-8 space-y-6">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-4">Bankalar (TRY)</label>
                                <div class="grid grid-cols-2 gap-3" id="aydin-banks-container"></div>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-4 border-t pt-6">Kripto (USD)</label>
                                <div class="grid grid-cols-2 gap-3" id="aydin-crypto-container"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Berna Card -->
                    <div class="bg-white rounded-[32px] border border-slate-100 shadow-sm overflow-hidden">
                        <div class="p-8 border-b border-slate-50 flex justify-between items-center text-right">
                            <span id="berna-total" class="bg-purple-600 text-white px-4 py-2 rounded-2xl text-sm font-bold shadow-lg shadow-purple-100">0 ₺</span>
                            <div>
                                <h3 class="font-bold text-xl">Berna Kaya</h3>
                                <p class="text-xs text-slate-400 font-medium">Bireysel Portföy</p>
                            </div>
                        </div>
                        <div class="p-8 space-y-6">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-4 text-right">Bankalar (TRY)</label>
                                <div class="grid grid-cols-2 gap-3" id="berna-banks-container"></div>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-4 border-t pt-6 text-right">Kripto (USD)</label>
                                <div class="grid grid-cols-2 gap-3" id="berna-crypto-container"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-transfer" class="tab-content max-w-2xl mx-auto">
                <div class="bg-white rounded-[40px] p-10 border border-slate-100 shadow-xl">
                    <h2 class="text-2xl font-bold mb-8">Hızlı İşlem Kaydı</h2>
                    <form id="transfer-form" onsubmit="handleTransfer(event)" class="space-y-6">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-500 ml-1 uppercase">İşlem Türü</label>
                            <select id="t-type" onchange="updateTransferForm()" class="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-blue-500 rounded-2xl outline-none font-semibold transition-all">
                                <option value="bank_to_crypto">Banka -> Kripto (48S Blokaj)</option>
                                <option value="crypto_to_crypto">Kripto -> Kripto (Transfer)</option>
                                <option value="p2p_sell">Kripto -> Banka (P2P Satış)</option>
                                <option value="bank_to_bank">Banka -> Banka (EFT/Havale)</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-500 ml-1 uppercase">Kişi</label>
                            <select id="t-person" onchange="updateTransferForm()" class="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-blue-500 rounded-2xl outline-none font-semibold transition-all">
                                <option value="aydin">Aydın Kaya</option>
                                <option value="berna">Berna Kaya</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-500 ml-1 uppercase">Kaynak</label>
                                <select id="t-source" class="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-blue-500 rounded-2xl outline-none font-semibold"></select>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-500 ml-1 uppercase">Hedef</label>
                                <select id="t-target" class="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-blue-500 rounded-2xl outline-none font-semibold"></select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-500 ml-1 uppercase">Çıkan Tutar</label>
                                <input type="number" id="t-amount-1" placeholder="0.00" step="0.01" required class="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-red-500 rounded-2xl outline-none font-bold">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-500 ml-1 uppercase">Giren Tutar</label>
                                <input type="number" id="t-amount-2" placeholder="0.00" step="0.01" required class="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-green-500 rounded-2xl outline-none font-bold text-green-600">
                            </div>
                        </div>
                        <button type="submit" class="w-full py-5 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-200 active:scale-95 transition-all">SİSTEME İŞLE</button>
                    </form>
                </div>
            </div>

            <div id="tab-blocks" class="tab-content max-w-4xl mx-auto space-y-6">
                <h2 class="text-2xl font-bold">Bekleyen Blokajlar</h2>
                <div id="blocks-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div id="tab-history" class="tab-content max-w-4xl mx-auto">
                <div class="bg-white rounded-[32px] border border-slate-100 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-slate-50">
                        <h2 class="text-xl font-bold">İşlem Geçmişi</h2>
                    </div>
                    <div id="history-list" class="divide-y divide-slate-50"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Nav -->
    <nav class="mobile-nav hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-6 py-4 justify-around items-center z-50">
        <button onclick="switchTab('dashboard')" class="p-2 tab-btn nav-active" data-tab="dashboard"><i data-lucide="layout-grid"></i></button>
        <button onclick="switchTab('transfer')" class="p-2 tab-btn text-slate-400" data-tab="transfer"><i data-lucide="arrow-up-right"></i></button>
        <button onclick="switchTab('blocks')" class="p-2 tab-btn text-slate-400" data-tab="blocks"><i data-lucide="timer"></i></button>
        <button onclick="switchTab('history')" class="p-2 tab-btn text-slate-400" data-tab="history"><i data-lucide="scroll-text"></i></button>
    </nav>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden z-[100] flex items-center justify-center p-6">
        <div class="bg-white rounded-[40px] w-full max-w-xs p-10 shadow-2xl">
            <h4 id="modal-title" class="text-center text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">VERİ GÜNCELLE</h4>
            <input type="number" id="modal-input" class="w-full text-center text-5xl font-bold outline-none bg-slate-50 p-6 rounded-3xl border-2 border-transparent focus:border-blue-500 mb-8">
            <div class="space-y-3">
                <button onclick="saveEdit()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-bold shadow-lg shadow-blue-100 active:scale-95 transition-all">KAYDET</button>
                <button onclick="closeEditModal()" class="w-full py-4 text-slate-400 font-semibold">İPTAL</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Setup
        const firebaseConfig = JSON.parse('{"apiKey":"AIzaSyBPFWe9FSkUBaiyaeBMhiXZm7g8QlfZzKQ","authDomain":"kripto-ee5f6.firebaseapp.com","projectId":"kripto-ee5f6","storageBucket":"kripto-ee5f6.firebasestorage.app","messagingSenderId":"896521474533","appId":"1:896521474533:web:6e054c33637cb500e59f0c"}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kripto-takip-v1-3';

        let state = {
            aydin: { banks: { 'ON Bank': 0, 'Kuveyt Türk': 0, 'İş Bankası': 0, 'Akbank': 0 }, crypto: { 'Binance TR': 0, 'Binance Global': 0 } },
            berna: { banks: { 'DenizBank': 0, 'Enpara': 0, 'Yapı Kredi': 0 }, crypto: { 'BtcTurk': 0, 'Binance Global': 0 } },
            blocks: [],
            history: []
        };
        let usdRate = 34.65;
        let currentUser = null;

        // AUTH & SYNC (CORRECTED PATHS)
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (e) {
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth error:", err);
                updateStatus("Bağlantı Hatası", "bg-red-500");
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                updateStatus("Bağlı", "bg-green-500");
                listenData();
            }
        });

        function listenData() {
            if (!currentUser) return;
            // RULE 1: Segment check - artifacts(1)/appId(2)/public(3)/data(4)/mainState(5)/dataDoc(6)
            // Segment sayısı her zaman çift olmalıdır. "mainState" koleksiyon, "dataDoc" dokümandır.
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'mainState', 'dataDoc');
            
            onSnapshot(docRef, (snap) => {
                if (snap.exists()) {
                    state = snap.data();
                    renderAll();
                } else {
                    saveData();
                }
            }, (err) => {
                console.error("Snapshot error:", err);
                updateStatus("Erişim Yok", "bg-red-500");
            });
        }

        async function saveData() {
            if (!currentUser) return;
            updateStatus("Yükleniyor...", "bg-orange-400", true);
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'mainState', 'dataDoc');
            try {
                await setDoc(docRef, state);
                updateStatus("Güncellendi", "bg-green-500");
            } catch (e) {
                console.error("Save error:", e);
                updateStatus("Hata", "bg-red-500");
            }
        }

        function updateStatus(txt, cls, load = false) {
            const statusText = document.getElementById('sync-status');
            const statusDot = document.getElementById('sync-dot');
            if (statusText) statusText.innerText = txt;
            if (statusDot) statusDot.className = `w-1.5 h-1.5 rounded-full ${cls} ${load ? 'loading-pulse' : ''}`;
        }

        // UI RENDERERS
        function renderAll() {
            const fmt = (v, c) => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: c, maximumFractionDigits: 0 }).format(v);
            const card = (p, t, n, v, c) => `
                <div onclick="openEditModal('${p}','${t}','${n}',${v})" class="bg-slate-50 p-4 rounded-2xl border border-transparent hover:border-blue-200 active:scale-95 transition-all cursor-pointer">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter truncate">${n}</p>
                    <p class="text-sm font-black text-slate-800">${fmt(v, c)}</p>
                </div>`;

            let aT = 0, aU = 0, bT = 0, bU = 0;

            let aB = ""; 
            Object.entries(state.aydin.banks).forEach(([n,v]) => { aT+=v; aB+=card('aydin','banks',n,v,'TRY')});
            let aC = ""; 
            Object.entries(state.aydin.crypto).forEach(([n,v]) => { aU+=v; aC+=card('aydin','crypto',n,v,'USD')});
            document.getElementById('aydin-banks-container').innerHTML = aB;
            document.getElementById('aydin-crypto-container').innerHTML = aC;
            document.getElementById('aydin-total').innerText = fmt(aT + (aU*usdRate), 'TRY');

            let bB = ""; 
            Object.entries(state.berna.banks).forEach(([n,v]) => { bT+=v; bB+=card('berna','banks',n,v,'TRY')});
            let bC = ""; 
            Object.entries(state.berna.crypto).forEach(([n,v]) => { bU+=v; bC+=card('berna','crypto',n,v,'USD')});
            document.getElementById('berna-banks-container').innerHTML = bB;
            document.getElementById('berna-crypto-container').innerHTML = bC;
            document.getElementById('berna-total').innerText = fmt(bT + (bU*usdRate), 'TRY');

            document.getElementById('header-total-value').innerText = fmt((aT+aU*usdRate)+(bT+bU*usdRate), 'TRY');

            renderBlocks();
            renderHistory();
            updateTransferForm();
            lucide.createIcons();
        }

        function renderBlocks() {
            const container = document.getElementById('blocks-container');
            container.innerHTML = (state.blocks || []).map(b => `
                <div class="bg-white p-6 rounded-[24px] border border-orange-100 flex justify-between items-center shadow-sm">
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">${b.person} - ${b.target}</p>
                        <p class="text-xl font-black">${b.amount} $</p>
                    </div>
                    <button onclick="removeBlock(${b.id})" class="bg-orange-50 text-orange-600 px-4 py-2 rounded-xl text-xs font-bold">Kaldır</button>
                </div>
            `).join('');
        }

        function renderHistory() {
            document.getElementById('history-list').innerHTML = (state.history || []).slice(0, 20).map(h => `
                <div class="p-5 flex justify-between items-center">
                    <div>
                        <p class="text-sm font-bold">${h.msg}</p>
                        <p class="text-[10px] text-slate-400 font-medium">${h.date}</p>
                    </div>
                    <span class="text-[9px] font-black px-3 py-1 rounded-full uppercase ${h.user === 'aydin' ? 'bg-blue-100 text-blue-600' : 'bg-purple-100 text-purple-600'}">${h.user}</span>
                </div>
            `).join('');
        }

        // ACTIONS
        let activeEdit = null;
        window.openEditModal = (p, t, n, v) => {
            activeEdit = { p, t, n };
            document.getElementById('modal-title').innerText = n;
            document.getElementById('modal-input').value = v;
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        window.closeEditModal = () => document.getElementById('edit-modal').classList.add('hidden');

        window.saveEdit = async () => {
            const val = parseFloat(document.getElementById('modal-input').value) || 0;
            state[activeEdit.p][activeEdit.t][activeEdit.n] = val;
            state.history.unshift({ date: new Date().toLocaleString('tr-TR'), msg: `${activeEdit.n} Güncellendi`, user: activeEdit.p });
            await saveData();
            closeEditModal();
        };

        window.updateTransferForm = () => {
            const p = document.getElementById('t-person').value;
            const type = document.getElementById('t-type').value;
            const src = document.getElementById('t-source');
            const trg = document.getElementById('t-target');
            if(!src || !trg) return;
            src.innerHTML = ""; trg.innerHTML = "";

            const banks = Object.keys(state[p].banks);
            const crypto = Object.keys(state[p].crypto);

            if (type === 'bank_to_crypto') {
                banks.forEach(b => src.add(new Option(b, b)));
                crypto.forEach(c => trg.add(new Option(c, c)));
            } else if (type === 'crypto_to_crypto') {
                crypto.forEach(c => src.add(new Option(c, c)));
                crypto.forEach(c => trg.add(new Option(c, c)));
            } else if (type === 'p2p_sell') {
                crypto.forEach(c => src.add(new Option(c, c)));
                banks.forEach(b => trg.add(new Option(b, b)));
            } else {
                banks.forEach(b => src.add(new Option(b, b)));
                banks.forEach(b => trg.add(new Option(b, b)));
            }
        };

        window.handleTransfer = async (e) => {
            e.preventDefault();
            const type = document.getElementById('t-type').value;
            const p = document.getElementById('t-person').value;
            const src = document.getElementById('t-source').value;
            const trg = document.getElementById('t-target').value;
            const a1 = parseFloat(document.getElementById('t-amount-1').value) || 0;
            const a2 = parseFloat(document.getElementById('t-amount-2').value) || 0;

            if (type === 'bank_to_crypto') {
                state[p].banks[src] -= a1; state[p].crypto[trg] += a2;
                state.blocks.push({ id: Date.now(), person: p, target: trg, amount: a2 });
            } else if (type === 'crypto_to_crypto') {
                state[p].crypto[src] -= a1; state[p].crypto[trg] += a2;
            } else if (type === 'p2p_sell') {
                state[p].crypto[src] -= a1; state[p].banks[trg] += a2;
            } else {
                state[p].banks[src] -= a1; state[p].banks[trg] += a2;
            }

            state.history.unshift({ date: new Date().toLocaleString('tr-TR'), msg: `${src} -> ${trg} (${a2})`, user: p });
            await saveData();
            switchTab('dashboard');
            e.target.reset();
        };

        window.removeBlock = async (id) => {
            state.blocks = state.blocks.filter(b => b.id !== id);
            await saveData();
        };

        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => {
                if (b.dataset.tab === id) b.classList.add('nav-active');
                else b.classList.remove('nav-active');
            });
            lucide.createIcons();
        };

        const updateRate = async () => {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTTRY');
                const d = await res.json();
                usdRate = parseFloat(d.price);
                document.getElementById('live-rate-badge').innerText = `${usdRate.toFixed(2)} ₺`;
                renderAll();
            } catch (e) {}
        };

        window.saveData = saveData;
        setInterval(updateRate, 60000);
        updateRate();
        initAuth();
    </script>
</body>
</html>
