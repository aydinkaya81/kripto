<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KayaFinans Pro v2.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --ios-blue: #007AFF; --ios-bg: #F2F2F7; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--ios-bg); -webkit-tap-highlight-color: transparent; overflow: hidden; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: ios-fade 0.4s ease; }
        @keyframes ios-fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .ios-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-radius: 24px; border: 0.5px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body class="text-slate-900 h-screen flex flex-col">

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar (Masaüstü) -->
        <aside class="w-80 bg-white border-r border-slate-200 hidden lg:flex flex-col p-8 gap-8">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg text-white">
                    <i data-lucide="wallet" class="w-5 h-5"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">KayaFinans</h1>
            </div>
            <nav class="flex flex-col gap-2">
                <button onclick="switchTab('dashboard')" class="flex items-center gap-4 p-4 rounded-2xl font-bold text-blue-600 bg-blue-50" id="btn-dashboard">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i> Özet
                </button>
                <button onclick="switchTab('transfer')" class="flex items-center gap-4 p-4 rounded-2xl font-bold text-slate-400" id="btn-transfer">
                    <i data-lucide="send" class="w-5 h-5"></i> Yeni İşlem
                </button>
                <button onclick="switchTab('history')" class="flex items-center gap-4 p-4 rounded-2xl font-bold text-slate-400" id="btn-history">
                    <i data-lucide="clock" class="w-5 h-5"></i> Geçmiş
                </button>
            </nav>
            <div class="mt-auto ios-card p-6 shadow-sm border border-slate-100">
                <div class="flex items-center gap-2 mb-2">
                    <div id="status-dot" class="w-2 h-2 rounded-full bg-orange-500"></div>
                    <span id="status-text" class="text-[10px] font-bold text-slate-500 uppercase">Sistem Başlıyor...</span>
                </div>
                <p id="last-update" class="text-[9px] text-slate-400">Veri senkronizasyonu bekleniyor</p>
            </div>
        </aside>

        <!-- Ana Ekran -->
        <main class="flex-1 overflow-y-auto relative pb-32 lg:pb-12">
            <!-- Üst Bilgi Barı (Mobil) -->
            <div class="lg:hidden p-8 pt-16 flex justify-between items-end">
                <div>
                    <h2 class="text-3xl font-black">Varlıklar</h2>
                    <p id="usd-rate-text" class="text-xs font-bold text-blue-500 mt-1 uppercase tracking-tighter">USDT: Yükleniyor...</p>
                </div>
                <div class="text-right">
                    <p id="total-balance" class="text-2xl font-black text-slate-900">0 ₺</p>
                    <div id="status-mobile" class="text-[8px] font-black bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full inline-block">BAĞLANIYOR...</div>
                </div>
            </div>

            <div class="p-6 lg:p-12 max-w-6xl mx-auto space-y-8">
                
                <!-- ÖZET TAB -->
                <div id="tab-dashboard" class="tab-content active space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Aydın Kaya Kart -->
                        <div class="ios-card overflow-hidden shadow-xl border-t-4 border-slate-900">
                            <div class="p-8 bg-white flex justify-between items-center border-b border-slate-50">
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Yönetici</p>
                                    <h3 class="text-2xl font-bold">Aydın Kaya</h3>
                                </div>
                                <div id="aydin-total" class="text-2xl font-black text-slate-900">0 ₺</div>
                            </div>
                            <div class="p-6 space-y-6 bg-slate-50/30">
                                <div>
                                    <h4 class="text-[10px] font-black text-slate-400 uppercase mb-3 flex items-center gap-2 px-2">
                                        <i data-lucide="building-2" class="w-3 h-3"></i> Bankalar (₺)
                                    </h4>
                                    <div id="aydin-banks" class="space-y-2"></div>
                                </div>
                                <div>
                                    <h4 class="text-[10px] font-black text-slate-400 uppercase mb-3 flex items-center gap-2 px-2">
                                        <i data-lucide="bitcoin" class="w-3 h-3"></i> Kripto ($)
                                    </h4>
                                    <div id="aydin-crypto" class="space-y-2"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Berna Kaya Kart -->
                        <div class="ios-card overflow-hidden shadow-xl border-t-4 border-blue-600">
                            <div class="p-8 bg-white flex justify-between items-center border-b border-slate-50">
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Ortağın</p>
                                    <h3 class="text-2xl font-bold">Berna Kaya</h3>
                                </div>
                                <div id="berna-total" class="text-2xl font-black text-slate-900">0 ₺</div>
                            </div>
                            <div class="p-6 space-y-6 bg-slate-50/30">
                                <div>
                                    <h4 class="text-[10px] font-black text-slate-400 uppercase mb-3 flex items-center gap-2 px-2">
                                        <i data-lucide="building-2" class="w-3 h-3"></i> Bankalar (₺)
                                    </h4>
                                    <div id="berna-banks" class="space-y-2"></div>
                                </div>
                                <div>
                                    <h4 class="text-[10px] font-black text-slate-400 uppercase mb-3 flex items-center gap-2 px-2">
                                        <i data-lucide="bitcoin" class="w-3 h-3"></i> Kripto ($)
                                    </h4>
                                    <div id="berna-crypto" class="space-y-2"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TRANSFER TAB -->
                <div id="tab-transfer" class="tab-content">
                    <div class="ios-card p-8 max-w-xl mx-auto shadow-2xl border-2 border-slate-100">
                        <h3 class="text-2xl font-bold mb-6 flex items-center gap-3">
                            <i data-lucide="send" class="text-blue-600"></i> İşlem Kaydet
                        </h3>
                        <form id="transfer-form" class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-2">
                                    <label class="text-[10px] font-bold text-slate-400 px-2 uppercase">KİME</label>
                                    <select id="tr-person" class="w-full bg-slate-100 p-4 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-blue-500">
                                        <option value="aydin">Aydın Kaya</option>
                                        <option value="berna">Berna Kaya</option>
                                    </select>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] font-bold text-slate-400 px-2 uppercase">İŞLEM TİPİ</label>
                                    <select id="tr-type" class="w-full bg-slate-100 p-4 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-blue-500">
                                        <option value="b2b">Nakit Giriş/Çıkış</option>
                                        <option value="b2c">Kripto Alım/Satım</option>
                                    </select>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-2 text-center">
                                    <label class="text-[10px] font-bold text-red-400 uppercase">ÇIKAN (-)</label>
                                    <input type="number" id="tr-out" placeholder="0" class="w-full bg-red-50 p-4 rounded-2xl font-bold text-center text-red-600 outline-none">
                                </div>
                                <div class="space-y-2 text-center">
                                    <label class="text-[10px] font-bold text-green-400 uppercase">GİREN (+)</label>
                                    <input type="number" id="tr-in" placeholder="0" class="w-full bg-green-50 p-4 rounded-2xl font-bold text-center text-green-600 outline-none">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-bold shadow-lg hover:bg-black active:scale-95 transition-all mt-4">KAYDI TAMAMLA</button>
                        </form>
                    </div>
                </div>

                <!-- HISTORY TAB -->
                <div id="tab-history" class="tab-content">
                    <div class="ios-card overflow-hidden shadow-lg border border-slate-100">
                        <div class="p-6 border-b border-slate-50 flex justify-between items-center bg-white">
                            <h3 class="font-bold flex items-center gap-2">
                                <i data-lucide="list" class="w-4 h-4 text-blue-600"></i> Hesap Hareketleri
                            </h3>
                            <button onclick="clearLogs()" class="text-red-500 text-[10px] font-bold uppercase hover:bg-red-50 px-3 py-1 rounded-full">Temizle</button>
                        </div>
                        <div id="history-list" class="divide-y divide-slate-50 bg-white/50 min-h-[200px]"></div>
                    </div>
                </div>

            </div>
        </main>

        <!-- Mobil Alt Nav -->
        <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-3xl border-t border-slate-100 px-8 pb-10 pt-4 flex justify-around z-50">
            <button onclick="switchTab('dashboard')" class="flex flex-col items-center gap-1 text-blue-600 nav-btn" data-tab="dashboard">
                <i data-lucide="layout-grid" class="w-6 h-6"></i>
                <span class="text-[9px] font-bold uppercase">Özet</span>
            </button>
            <button onclick="switchTab('transfer')" class="flex flex-col items-center gap-1 text-slate-400 nav-btn" data-tab="transfer">
                <i data-lucide="plus-circle" class="w-6 h-6"></i>
                <span class="text-[9px] font-bold uppercase">İşlem</span>
            </button>
            <button onclick="switchTab('history')" class="flex flex-col items-center gap-1 text-slate-400 nav-btn" data-tab="history">
                <i data-lucide="clock" class="w-6 h-6"></i>
                <span class="text-[9px] font-bold uppercase">Geçmiş</span>
            </button>
        </nav>
    </div>

    <!-- Düzenleme Modalı -->
    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden z-[100] flex items-center justify-center p-6">
        <div class="bg-white rounded-[40px] w-full max-w-xs p-10 shadow-2xl scale-in">
            <h4 id="modal-title" class="text-center text-[11px] font-black text-slate-400 uppercase mb-4 tracking-widest">GÜNCELLE</h4>
            <div class="relative mb-8">
                <input type="number" id="modal-input" class="w-full text-center text-5xl font-black outline-none bg-slate-50 p-6 rounded-[30px] border-2 border-slate-100 focus:border-blue-500 transition-colors">
                <span id="modal-currency" class="absolute bottom-2 right-4 text-xs font-bold text-slate-300"></span>
            </div>
            <div class="flex flex-col gap-3">
                <button onclick="saveModal()" class="w-full bg-blue-600 p-5 rounded-2xl font-bold text-white shadow-xl shadow-blue-200 active:scale-95 transition-all">GÜNCELLE</button>
                <button onclick="closeModal()" class="w-full bg-slate-100 p-4 rounded-2xl font-bold text-slate-400 active:scale-95 transition-all">VAZGEÇ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPFWe9FSkUBaiyaeBMhiXZm7g8QlfZzKQ",
            authDomain: "kripto-ee5f6.firebaseapp.com",
            projectId: "kripto-ee5f6",
            storageBucket: "kripto-ee5f6.firebasestorage.app",
            messagingSenderId: "896521474533",
            appId: "1:896521474533:web:6e054c33637cb500e59f0c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // KRİTİK: Panelde bu yolu manuel oluşturmayı unutma!
        const stateDoc = doc(db, "kullanicilar", "kaya_ailesi");

        const initial = {
            aydin: {
                banks: { 'ON Bank': 0, 'Kuveyt Türk': 0, 'İş Bankası': 0, 'Halkbank': 0, 'Akbank': 0, 'TOM Bank': 0, 'VakıfBank': 0 },
                crypto: { 'Binance TR': 0, 'Binance Global': 0 }
            },
            berna: {
                banks: { 'DenizBank': 0, 'Enpara': 0, 'Yapı Kredi': 0, 'İş Bankası': 0, 'Akbank': 0 },
                crypto: { 'BtcTurk': 0, 'Binance Global': 0 }
            },
            logs: []
        };

        let state = {...initial};
        let usd = 34.65;
        let isSaving = false;

        async function start() {
            try {
                const userCred = await signInAnonymously(auth);
                console.log("Anonim giriş başarılı:", userCred.user.uid);
                
                // Firestore Canlı Dinleme
                onSnapshot(stateDoc, async (snap) => {
                    if (snap.exists()) {
                        state = snap.data();
                        updateStatus("Bulut Senkronize", "bg-green-500", "bg-green-100 text-green-600", "SENKRONİZE");
                    } else {
                        // Veritabanı boşsa ilk kurulumu yap
                        updateStatus("Veritabanı Hazırlanıyor...", "bg-blue-500", "bg-blue-100 text-blue-600", "HAZIRLANIYOR");
                        await setDoc(stateDoc, initial);
                    }
                    render();
                }, (err) => {
                    updateStatus("Hata: Erişim Yok", "bg-red-500", "bg-red-100 text-red-600", "ERİŞİM HATASI");
                    console.error("Firestore Hatası:", err);
                });
            } catch (e) {
                updateStatus("Hata: Auth Sorunu", "bg-red-500", "bg-red-100 text-red-600", "OTURUM HATASI");
            }
        }

        function updateStatus(text, dotColor, mobileClass, mobileText) {
            document.getElementById('status-dot').className = `w-2 h-2 rounded-full ${dotColor}`;
            document.getElementById('status-text').innerText = text;
            document.getElementById('status-mobile').className = `text-[8px] font-black ${mobileClass} px-2 py-0.5 rounded-full inline-block`;
            document.getElementById('status-mobile').innerText = mobileText;
            document.getElementById('last-update').innerText = "Güncel: " + new Date().toLocaleTimeString();
        }

        function render() {
            const fmt = (v, c) => new Intl.NumberFormat('tr-TR', { 
                style: 'currency', 
                currency: c, 
                maximumFractionDigits: 0 
            }).format(v);
            
            const card = (p, t, n, v, c) => `
                <div onclick="openModal('${p}','${t}','${n}',${v},'${c}')" class="bg-white p-4 rounded-2xl flex justify-between items-center active:scale-95 transition-all cursor-pointer border border-slate-100 shadow-sm">
                    <span class="text-[11px] font-bold text-slate-500 truncate mr-2">${n}</span>
                    <span class="text-sm font-black whitespace-nowrap">${fmt(v, c)}</span>
                </div>`;

            let aT = 0, aU = 0, bT = 0, bU = 0;

            // Banka ve Kripto Listelerini Doldur
            if(state.aydin) {
                document.getElementById('aydin-banks').innerHTML = Object.entries(state.aydin.banks || {}).map(([n,v]) => { aT += v; return card('aydin','banks',n,v,'TRY') }).join('');
                document.getElementById('aydin-crypto').innerHTML = Object.entries(state.aydin.crypto || {}).map(([n,v]) => { aU += v; return card('aydin','crypto',n,v,'USD') }).join('');
            }
            if(state.berna) {
                document.getElementById('berna-banks').innerHTML = Object.entries(state.berna.banks || {}).map(([n,v]) => { bT += v; return card('berna','banks',n,v,'TRY') }).join('');
                document.getElementById('berna-crypto').innerHTML = Object.entries(state.berna.crypto || {}).map(([n,v]) => { bU += v; return card('berna','crypto',n,v,'USD') }).join('');
            }

            const aSum = aT + (aU * usd);
            const bSum = bT + (bU * usd);

            document.getElementById('aydin-total').innerText = fmt(aSum, 'TRY');
            document.getElementById('berna-total').innerText = fmt(bSum, 'TRY');
            document.getElementById('total-balance').innerText = fmt(aSum + bSum, 'TRY');

            // Log Listesi
            document.getElementById('history-list').innerHTML = (state.logs || []).slice(0, 20).map(l => `
                <div class="p-5 flex justify-between items-center hover:bg-slate-50 transition-colors">
                    <div class="flex gap-4 items-center">
                        <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                             <i data-lucide="activity" class="w-4 h-4"></i>
                        </div>
                        <div>
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">${l.date}</p>
                            <p class="text-[11px] font-black text-slate-700">${l.msg}</p>
                        </div>
                    </div>
                    <span class="text-[8px] font-bold px-3 py-1 rounded-full ${l.user === 'aydin' ? 'bg-slate-800 text-white' : 'bg-blue-600 text-white'} uppercase">${l.user}</span>
                </div>
            `).join('');

            lucide.createIcons();
        }

        // Modal Mantığı
        let activeEdit = null;
        window.openModal = (p, t, n, v, c) => {
            activeEdit = { p, t, n };
            document.getElementById('modal-title').innerText = n;
            document.getElementById('modal-input').value = v;
            document.getElementById('modal-currency').innerText = c;
            document.getElementById('modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('modal-input').focus(), 100);
        };

        window.closeModal = () => document.getElementById('modal').classList.add('hidden');

        window.saveModal = async () => {
            if(isSaving) return;
            isSaving = true;
            const val = parseFloat(document.getElementById('modal-input').value) || 0;
            
            // State güncelle
            state[activeEdit.p][activeEdit.t][activeEdit.n] = val;
            state.logs.unshift({ 
                date: new Date().toLocaleDateString('tr-TR') + " " + new Date().toLocaleTimeString('tr-TR'), 
                msg: `${activeEdit.n} güncellendi: ${val}`, 
                user: activeEdit.p 
            });

            try {
                await setDoc(stateDoc, state);
                closeModal();
            } catch(e) { console.error("Kaydetme hatası:", e); }
            isSaving = false;
        };

        // Form İşlemi
        document.getElementById('transfer-form').onsubmit = async (e) => {
            e.preventDefault();
            const p = document.getElementById('tr-person').value;
            const amtOut = parseFloat(document.getElementById('tr-out').value) || 0;
            const amtIn = parseFloat(document.getElementById('tr-in').value) || 0;
            
            state.logs.unshift({ 
                date: new Date().toLocaleTimeString('tr-TR'), 
                msg: `Transfer: -${amtOut} / +${amtIn}`, 
                user: p 
            });

            await setDoc(stateDoc, state);
            e.target.reset();
            switchTab('dashboard');
        };

        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            
            // Nav buton stilleri
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.tab === id) btn.classList.add('text-blue-600');
                else btn.classList.remove('text-blue-600', 'text-slate-400');
                if(btn.dataset.tab !== id) btn.classList.add('text-slate-400');
            });

            lucide.createIcons();
        };

        window.clearLogs = async () => {
            if(!confirm("Tüm işlem geçmişini temizlemek istiyor musunuz?")) return;
            state.logs = [];
            await setDoc(stateDoc, state);
        };

        // Kur Güncelleme
        const updateKur = async () => {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTTRY');
                const data = await res.json();
                usd = parseFloat(data.price);
                document.getElementById('usd-rate-text').innerText = `USDT: ${usd.toFixed(2)} ₺`;
                render();
            } catch (e) {
                console.error("Kur alınamadı.");
            }
        };

        // Başlat
        updateKur();
        setInterval(updateKur, 60000); // 1 dakikada bir kur tazele
        start();
    </script>
</body>
</html>
